      - run: npx playwright test --grep @smoke --project=chromium
      - if: always()
        run: npm run report:flaky
      - if: always()
        run: npm run report:summary -- --title "UI chromium @smoke"
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: summary-${{ github.job }}
          retention-days: 7
          if-no-files-found: ignore
          path: reports/summary.json

  # --- Manual run (RF-80) -------------------------------------------------------------------------

  manual-api:
    if: github.event_name == 'workflow_dispatch' && (inputs.layer == 'all' || inputs.layer == 'api')
    needs: unit-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: ${{ inputs.suite }}
      BROWSER: ${{ inputs.browser }}
      LAYER: api
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - if: always()
        run: npm run report:summary -- --title "Manual API"
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: summary-${{ github.job }}
          retention-days: 7
          if-no-files-found: ignore
          path: reports/summary.json

  # Runs after manual-api, and also when manual-api was skipped (layer ui), never after it failed.
  manual-ui:
    if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && (inputs.layer == 'all' || inputs.layer == 'ui') }}
    needs: [unit-tests, manual-api]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: ${{ inputs.suite }}
      BROWSER: ${{ inputs.browser }}
      LAYER: ui
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - if: always()
        run: npm run report:summary -- --title "Manual UI"
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: summary-${{ github.job }}
          retention-days: 7
          if-no-files-found: ignore
          path: reports/summary.json

  # --- Regression chain (RF-91) ------------------------------------------------------------------

  # After a green manual regression on eyter_dev, release or main, start the same manual run on the
  # next branch (chained=true), so a regression started on eyter_dev runs on the four branches in
  # order, each on its own code. It only starts workflow runs: nothing is merged or promoted.
  chain-next:
    if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && inputs.suite == 'regression' && github.ref_name != 'production' }}
    needs: [checks, unit-tests, manual-api, manual-ui]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      actions: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUITE: ${{ inputs.suite }}
      BROWSER: ${{ inputs.browser }}
      LAYER: ${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:chain

  # --- Results page (RF-88) ------------------------------------------------------------------------

  # Runs after every test job of a push run, passed, failed or skipped, and replaces this branch's
  # entry on the GitHub Pages results page, keeping the other branches' latest entries. Only this
  # job may write to Pages. Manual runs never publish.
  publish-results:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [checks, unit-tests, eyter-dev-api, eyter-dev-ui-chromium, release-api, release-ui-chromium, release-ui-firefox, release-ui-webkit, main-api, main-ui-chromium, main-ui-firefox, main-ui-webkit, production-api, production-ui-chromium]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The result of every test job (success, failure, cancelled, skipped); no secret is involved.
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: summary-*
          path: reports/summaries
      - run: npm run report:pages
      - id: secrets
        if: always()
        run: npm run check:secrets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: reports/pages
      - id: deployment
        uses: actions/deploy-pages@v4

  # --- Promotion (RF-72 to RF-77)---------------------------------------------------------------

  # Last job: it starts only when no other job failed or was canceled (skipped gates of other
  # branches are fine). production is the last branch and never promotes; manual runs never promote.
  # One promotion at a time.
  promote:
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && (github.ref_name == 'eyter_dev' || github.ref_name == 'release' || github.ref_name == 'main') }}
    needs: [checks, unit-tests, eyter-dev-api, eyter-dev-ui-chromium, release-api, release-ui-chromium, release-ui-firefox, release-ui-webkit, main-api, main-ui-chromium, main-ui-firefox, main-ui-webkit, production-api, production-ui-chromium, manual-api, manual-ui, chain-next, publish-results]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    concurrency:
      group: promotion
      cancel-in-progress: false
    env:
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:promote
