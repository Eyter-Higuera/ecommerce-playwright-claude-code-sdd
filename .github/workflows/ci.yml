# GitHub Actions — Spec 000 RF-58 to RF-82: branch gates and automatic promotion
# eyter_dev → release → main → production.
#
# Every push to a promotion branch runs the checks (spec:check, lint, typecheck, unit tests), then
# that branch's Playwright gate (docs/test-plan.md §6):
#   eyter_dev  → smoke on api and chromium
#   release    → regression on api, chromium, firefox and webkit
#   main       → smoke on api, chromium, firefox and webkit
#   production → smoke on api and chromium (sanity after the last promotion)
# Each Playwright job runs check:secrets on its own reports, passed or failed, and uploads them only
# when that scan passes (RF-79). When every job of a push run on eyter_dev, release or main passes,
# the last job `promote` merges the tested commit into the next branch (scripts/ci-promote.ts,
# RF-72 to RF-77) with the PROMOTION_TOKEN secret: merges made with the default GITHUB_TOKEN would
# not start the next branch's run. A manual run (workflow_dispatch) selects SUITE and BROWSER
# through npm run ci:run-suite (RF-60 to RF-63) and never promotes. Credentials come only from
# GitHub encrypted secrets; nothing prints the environment (RF-64, RF-65, RF-81).
# tests/unit/ci/github-actions.test.ts checks this file.

name: CI

on:
  push:
    branches: [eyter_dev, release, main, production]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [smoke, regression]
        default: smoke
      browser:
        description: Browser for the UI tests (API tests always run once)
        type: choice
        options: [chromium, firefox, webkit, all]
        default: chromium

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        task: [spec:check, lint, typecheck, test:unit]
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ${{ matrix.task }}

  # --- eyter_dev gate (RF-58) --------------------------------------------------------------------

  smoke-api:
    if: github.event_name == 'push' && github.ref_name == 'eyter_dev'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npx playwright test --grep @smoke --project=api
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  smoke-ui-chromium:
    if: github.event_name == 'push' && github.ref_name == 'eyter_dev'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npx playwright test --grep @smoke --project=chromium
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  # --- release gate: full regression on every browser (RF-69) -------------------------------------

  release-regression:
    if: github.event_name == 'push' && github.ref_name == 'release'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: regression
      BROWSER: all
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  # --- main gate: smoke on every browser (RF-70) --------------------------------------------------

  main-smoke:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: smoke
      BROWSER: all
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  # --- production sanity gate (RF-71) -------------------------------------------------------------

  production-smoke:
    if: github.event_name == 'push' && github.ref_name == 'production'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: smoke
      BROWSER: chromium
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  # --- Manual run (RF-80) -------------------------------------------------------------------------

  run-suite:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      SUITE: ${{ inputs.suite }}
      BROWSER: ${{ inputs.browser }}
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:run-suite
      - if: always()
        run: npm run report:flaky
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/

  # --- Promotion (RF-72 to RF-77) ---------------------------------------------------------------

  # Last job: it starts only when no other job failed or was canceled (skipped gates of other
  # branches are fine). production is the last branch and never promotes; manual runs never promote.
  # One promotion at a time.
  promote:
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && (github.ref_name == 'eyter_dev' || github.ref_name == 'release' || github.ref_name == 'main') }}
    needs: [checks, smoke-api, smoke-ui-chromium, release-regression, main-smoke, production-smoke, run-suite]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    concurrency:
      group: promotion
      cancel-in-progress: false
    env:
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ci:promote
