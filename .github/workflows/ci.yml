        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            reports/
            test-results/
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
