# GitHub Actions — Spec 000 RF-58 to RF-88: branch gates as chained jobs, test summaries, results
# page and automatic promotion eyter_dev → release → main → production.
#
# Every push to a promotion branch runs one job per stage, each starting only after the previous one
# passed (RF-83): checks (spec:check, lint, typecheck; a failing check cancels the others) → unit-tests
# → the branch's API job → one UI job per browser, in the order chromium, firefox, webkit
# (docs/test-plan.md §6):
#   eyter_dev  → @smoke on api, then chromium
#   release    → @regression on api, then chromium, firefox and webkit
#   main       → @smoke on api, then chromium, firefox and webkit
#   production → @smoke on api, then chromium (sanity after the last promotion)
# A failed or canceled job skips every later job, and the run does not promote. Every test job adds a
# summary (passed, failed, skipped, flaky, total, duration, failed titles) to the run's Summary page;
# the unit job adds its code coverage and the spec:check leg the requirements coverage (RF-84 to
# RF-87). Each job runs check:secrets on its own reports, passed or failed, and uploads them only when
# that scan passes (RF-79). After the test jobs of a push run, publish-results updates the GitHub
# Pages results page with this branch's latest results (RF-88). When every job of a push run on eyter_dev, release
# or main passes, the last job `promote` merges the tested commit into the next branch
# (scripts/ci-promote.ts, RF-72 to RF-77) with the PROMOTION_TOKEN secret: merges made with the
# default GITHUB_TOKEN would not start the next branch's run. A manual run (workflow_dispatch) runs
# checks and unit-tests, then manual-api and manual-ui with the SUITE, BROWSER and LAYER inputs
# through npm run ci:run-suite (RF-60 to RF-63, RF-80, RF-90); a manual regression starts only from
# eyter_dev (RF-92). It never promotes or publishes. Credentials come only from GitHub encrypted
# secrets; nothing prints the environment (RF-64, RF-65, RF-81).
# tests/unit/ci/github-actions.test.ts checks this file.

name: CI

on:
  push:
    branches: [eyter_dev, release, main, production]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [smoke, regression]
        default: smoke
      browser:
        description: Browser for the UI tests (API tests always run once)
        type: choice
        options: [chromium, firefox, webkit, all]
        default: chromium
      layer:
        description: Tests to run (all = unit, then API and UI)
        type: choice
        options: [all, unit, api, ui]
        default: all
      chained:
        description: Started by the regression chain from the previous branch (set by CI, leave off)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  # --- Stage 1 and 2, shared by every run (RF-83) -------------------------------------------------

  checks:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      # A failing check cancels the other checks (RF-83).
      fail-fast: true
      matrix:
        task: [spec:check, lint, typecheck]
        # RF-86: the spec:check leg also reports the requirements coverage.
        include:
          - task: spec:check
            args: -- --summary
    steps:
      # RF-92: a manual regression starts from eyter_dev; on a later branch only the chain may start it.
      - if: github.event_name == 'workflow_dispatch' && inputs.suite == 'regression' && github.ref_name != 'eyter_dev' && !inputs.chained
        run: echo "::error::Regression starts from eyter_dev: run it there, it continues to release, main and production" && exit 1
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run ${{ matrix.task }} ${{ matrix.args }}
      - id: secrets
        if: always() && matrix.task == 'spec:check'
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: summary-${{ github.job }}
          retention-days: 7
          if-no-files-found: ignore
          path: reports/summary.json

  unit-tests:
    needs: checks
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      # RF-85: JSON results and code coverage, reported also when tests fail.
      - run: npm run test:unit:ci
      - if: always()
        run: npm run report:summary -- --title "Unit tests" --report reports/unit-results.json --coverage reports/coverage/coverage-summary.json
      - id: secrets
        if: always()
        run: npm run check:secrets
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.job }}-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            reports/
      - if: always() && steps.secrets.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: summary-${{ github.job }}
          retention-days: 7
          if-no-files-found: ignore
          path: reports/summary.json

  # --- eyter_dev gate (RF-58) ------------------------------------------------------------------------

  eyter-dev-api:
    if: github.event_name == 'push' && github.ref_name == 'eyter_dev'
    needs: unit-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      # The container user differs from the checkout owner; without this, git commands exit 128.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npx playwright test --grep @smoke --project=api
      - if: always()
        run: npm run report:flaky
      - if: always()
        run: npm run report:summary -- --title "API @smoke"
      - id: secrets
