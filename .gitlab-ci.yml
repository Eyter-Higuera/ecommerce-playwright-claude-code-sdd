# GitLab CI/CD — Spec 000 framework foundation: the `eyter_dev` gate (RF-58 to RF-67).
# Later specs add the `release` and `main` stages.
#
# Push to eyter_dev → spec:check, lint, typecheck, unit tests, API smoke and UI smoke (chromium),
# then check:secrets on the artifacts of each Playwright job. "Run pipeline" (web) → SUITE and
# BROWSER select the suite (RF-60 to RF-63).
# Credentials come from masked, protected GitLab CI/CD variables (RF-64). No job prints the
# environment (RF-65); tests/unit/ci/gitlab-ci.test.ts checks this file.

stages:
  - check
  - smoke
  - scan

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  # RF-2: the image version must equal the locked @playwright/test version.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  before_script:
    - npm ci

variables:
  CI: "true"
  SUITE: "smoke"
  BROWSER: "chromium"

# --- Templates -------------------------------------------------------------------------------

# Gate jobs run on pushes to eyter_dev only.
.push-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"

# Manual "Run pipeline" jobs.
.manual-run:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

# Every Playwright job: flaky count in the log, JUnit published to GitLab, evidence kept 7 days
# whether the job passed or failed.
.playwright-reports:
  after_script:
    - npm run report:flaky
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - reports/
      - test-results/
    reports:
      junit: reports/junit.xml

# check:secrets runs once per Playwright job, on that job's artifacts only, so two jobs' reports
# never overwrite each other before the scan.
.check-secrets:
  stage: scan
  script:
    - npm run check:secrets

# --- eyter_dev gate (push) ---------------------------------------------------------------------

spec-check:
  stage: check
  extends: .push-gate
  script:
    - npm run spec:check

lint:
  stage: check
  extends: .push-gate
  script:
    - npm run lint

typecheck:
  stage: check
  extends: .push-gate
  script:
    - npm run typecheck

unit:
  stage: check
  extends: .push-gate
  script:
    - npm run test:unit

smoke-api:
  stage: smoke
  extends: [.push-gate, .playwright-reports]
  script:
    - npx playwright test --grep @smoke --project=api

smoke-ui-chromium:
  stage: smoke
  extends: [.push-gate, .playwright-reports]
  script:
    - npx playwright test --grep @smoke --project=chromium

check-secrets-api:
  extends: [.push-gate, .check-secrets]
  needs:
    - job: smoke-api
      artifacts: true

check-secrets-ui-chromium:
  extends: [.push-gate, .check-secrets]
  needs:
    - job: smoke-ui-chromium
      artifacts: true

# --- Manual run (web) --------------------------------------------------------------------------

run-suite:
  stage: smoke
  extends: [.manual-run, .playwright-reports]
  script:
    - npm run ci:run-suite

check-secrets-run-suite:
  extends: [.manual-run, .check-secrets]
  needs:
    - job: run-suite
      artifacts: true
