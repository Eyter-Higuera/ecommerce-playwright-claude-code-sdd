# GitLab CI/CD — Spec 000 framework foundation: branch gates and automatic promotion
# eyter_dev → release → main → production (RF-58 to RF-67, RF-69 to RF-77).
#
# Every push to a promotion branch runs the check jobs (spec:check, lint, typecheck, unit tests)
# and that branch's Playwright gate (docs/test-plan.md §6), then check:secrets on the artifacts of
# each Playwright job:
#   eyter_dev  → smoke on api and chromium
#   release    → regression on api, chromium, firefox and webkit
#   main       → smoke on api, chromium, firefox and webkit
#   production → smoke on api and chromium (sanity after the last promotion)
# When every job of a push pipeline on eyter_dev, release or main succeeds, the `promote` stage
# merges the tested commit into the next branch through a merge request pinned to that commit
# (scripts/ci-promote.ts). Any failed or canceled job stops the chain: `promote` never starts.
# "Run pipeline" (web) → SUITE and BROWSER select the suite (RF-60 to RF-63); it never promotes.
# Credentials and PROMOTION_TOKEN come from masked, protected GitLab CI/CD variables (RF-64,
# RF-77). No job prints the environment (RF-65); tests/unit/ci/gitlab-ci.test.ts checks this file.

stages:
  - check
  - test
  - scan
  - promote

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  # RF-2: the image version must equal the locked @playwright/test version.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  before_script:
    - npm ci

variables:
  CI: "true"
  SUITE: "smoke"
  BROWSER: "chromium"

# --- Templates -------------------------------------------------------------------------------

# Check jobs run on pushes to every promotion branch.
.checks:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"

# One Playwright gate per branch.
.eyter-dev-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"

.release-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"

.main-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

.production-gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"

# Manual "Run pipeline" jobs.
.manual-run:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

# Every Playwright job: flaky count in the log, JUnit published to GitLab, evidence kept 7 days
# whether the job passed or failed.
.playwright-reports:
  after_script:
    - npm run report:flaky
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - reports/
      - test-results/
    reports:
      junit: reports/junit.xml

# check:secrets runs once per Playwright job, on that job's artifacts only, so two jobs' reports
# never overwrite each other before the scan.
.check-secrets:
  stage: scan
  script:
    - npm run check:secrets

# --- Check jobs (every promotion branch) -------------------------------------------------------

spec-check:
  stage: check
  extends: .checks
  script:
    - npm run spec:check

lint:
  stage: check
  extends: .checks
  script:
    - npm run lint

typecheck:
  stage: check
  extends: .checks
  script:
    - npm run typecheck

unit:
  stage: check
  extends: .checks
  script:
    - npm run test:unit

# --- eyter_dev gate ----------------------------------------------------------------------------

smoke-api:
  stage: test
  extends: [.eyter-dev-gate, .playwright-reports]
  script:
    - npx playwright test --grep @smoke --project=api

smoke-ui-chromium:
  stage: test
  extends: [.eyter-dev-gate, .playwright-reports]
  script:
    - npx playwright test --grep @smoke --project=chromium

check-secrets-api:
  extends: [.eyter-dev-gate, .check-secrets]
  needs:
    - job: smoke-api
      artifacts: true

check-secrets-ui-chromium:
  extends: [.eyter-dev-gate, .check-secrets]
  needs:
    - job: smoke-ui-chromium
      artifacts: true

# --- release gate: full regression on every browser (RF-69) ------------------------------------

release-regression:
  stage: test
  extends: [.release-gate, .playwright-reports]
  variables:
    SUITE: "regression"
    BROWSER: "all"
  script:
    - npm run ci:run-suite

check-secrets-release:
  extends: [.release-gate, .check-secrets]
  needs:
    - job: release-regression
      artifacts: true

# --- main gate: smoke on every browser (RF-70) -------------------------------------------------

main-smoke:
  stage: test
  extends: [.main-gate, .playwright-reports]
  variables:
    SUITE: "smoke"
    BROWSER: "all"
  script:
    - npm run ci:run-suite

check-secrets-main:
  extends: [.main-gate, .check-secrets]
  needs:
    - job: main-smoke
      artifacts: true

# --- production sanity gate (RF-71) ------------------------------------------------------------

production-smoke:
  stage: test
  extends: [.production-gate, .playwright-reports]
  variables:
    SUITE: "smoke"
    BROWSER: "chromium"
  script:
    - npm run ci:run-suite

check-secrets-production:
  extends: [.production-gate, .check-secrets]
  needs:
    - job: production-smoke
      artifacts: true

# --- Promotion (RF-72 to RF-77) ----------------------------------------------------------------

# Last stage: GitLab starts it only when every job of the earlier stages succeeded. production is
# the last branch and never promotes; web runs never promote. One promotion at a time.
promote:
  stage: promote
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "eyter_dev"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "release"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: on_success
  resource_group: promotion
  script:
    - npm run ci:promote

# --- Manual run (web) --------------------------------------------------------------------------

run-suite:
  stage: test
  extends: [.manual-run, .playwright-reports]
  script:
    - npm run ci:run-suite

check-secrets-run-suite:
  extends: [.manual-run, .check-secrets]
  needs:
    - job: run-suite
      artifacts: true
